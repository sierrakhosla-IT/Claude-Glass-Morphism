<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Execution Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#F8F4EF;
    --glass-fill: rgba(255,255,255,0.58);
    --glass-fill-soft: rgba(255,255,255,0.4);
    --glass-border: rgba(255,255,255,0.75);
    --glow-amber-soft: rgba(232,147,74,0.16);
    --ink: #2B241C;
    --ink-soft: #6B6055;
    --ink-faint: #9C9186;
    --accent: #D9863F;
    --accent-deep: #B96A2C;
    --accent-wash: rgba(217,134,63,0.12);
    --line: rgba(43,36,28,0.08);
    --danger: #C1543A;
    --sage: #7C8E6F;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 10px;
    --elevation: 0 1px 2px rgba(43,36,28,0.04), 0 12px 32px -12px rgba(217,134,63,0.18), inset 0 1px 0 rgba(255,255,255,0.6);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Instrument Sans', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(45vw 45vw at 8% 0%, rgba(217,134,63,0.14), transparent 60%),
      radial-gradient(40vw 40vw at 95% 20%, rgba(124,142,111,0.10), transparent 60%),
      radial-gradient(50vw 40vw at 40% 100%, rgba(217,134,63,0.10), transparent 60%),
      var(--canvas);
    min-height:100vh;
  }

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:rgba(43,36,28,0.12);border-radius:10px;}
  ::-webkit-scrollbar-track{background:transparent;}

  h1,h2,h3,h4{font-family:'Outfit', sans-serif; margin:0; letter-spacing:-0.01em;}

  .app{
    display:grid;
    grid-template-columns:232px 1fr;
    min-height:100vh;
  }

  .sidebar{
    padding:28px 18px;
    display:flex;
    flex-direction:column;
    gap:26px;
    background:rgba(255,255,255,0.32);
    backdrop-filter:blur(24px) saturate(1.4);
    -webkit-backdrop-filter:blur(24px) saturate(1.4);
    border-right:1px solid rgba(255,255,255,0.6);
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 6px;}
  .brand-mark{
    width:34px;height:34px;border-radius:10px;
    background:var(--accent);
    box-shadow:0 4px 10px -4px rgba(217,134,63,0.35);
    flex-shrink:0;
  }
  .brand-text{font-family:'Outfit',sans-serif; font-weight:600; font-size:15.5px;}
  .brand-sub{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.08em; margin-top:1px;}

  .nav-group{display:flex; flex-direction:column; gap:2px;}
  .nav-label{font-size:10px; text-transform:uppercase; letter-spacing:0.09em; color:var(--ink-faint); padding:0 10px; margin-bottom:6px; font-weight:600;}
  .nav-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 10px; border-radius:10px; cursor:pointer;
    font-size:13.5px; color:var(--ink-soft); font-weight:500;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item:hover{background:rgba(43,36,28,0.04); color:var(--ink);}
  .nav-item.active{background:var(--accent-wash); color:var(--accent-deep);}
  .nav-count{
    font-size:11px; font-weight:600; color:var(--ink-faint);
    background:rgba(43,36,28,0.05); padding:1px 7px; border-radius:20px;
  }
  .nav-item.active .nav-count{background:rgba(217,134,63,0.18); color:var(--accent-deep);}

  .sidebar-footer{margin-top:auto; padding:0 6px;}
  .add-task-btn{
    width:100%; padding:11px 14px; border-radius:12px; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--accent), var(--accent-deep));
    color:#fff; font-family:'Outfit',sans-serif; font-weight:600; font-size:13.5px;
    box-shadow:0 8px 20px -8px rgba(217,134,63,0.65);
  }
  .clean-session-btn{
    width:100%; padding:9px 14px; margin-top:8px; border-radius:12px; cursor:pointer;
    background:transparent; border:1px solid var(--line);
    color:var(--ink-soft); font-family:'Instrument Sans',sans-serif; font-weight:600; font-size:12.5px;
  }
  .clean-session-btn:hover{border-color:var(--ink-faint); color:var(--ink);}

  .main{
    padding:28px 32px 60px;
    display:flex;
    flex-direction:column;
    gap:22px;
    max-width:1400px;
  }

  .mission{
    border-radius:var(--radius-lg);
    padding:22px 26px;
    background:rgba(255,255,255,0.4);
    backdrop-filter:blur(26px) saturate(1.4);
    -webkit-backdrop-filter:blur(26px) saturate(1.4);
    border:1px solid rgba(255,255,255,0.85);
    box-shadow:0 1px 1px rgba(255,255,255,0.6) inset, 0 20px 40px -18px rgba(43,36,28,0.16);
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:14px;
  }
  .mission-tile{
    background:rgba(255,255,255,0.45);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.7);
    border-radius:var(--radius-md);
    padding:14px 16px;
    color:var(--ink);
    min-height:64px;
  }
  .mission-tile-label{font-size:10px; text-transform:uppercase; letter-spacing:0.09em; color:var(--ink-faint); font-weight:600; margin-bottom:5px;}
  .mission-tile-value{font-size:13.5px; line-height:1.4; font-weight:500; outline:none; min-height:18px; color:var(--ink);}
  .mission-tile-value:empty:before{content:attr(data-placeholder); opacity:0.5; color:var(--ink-faint);}

  .glass{
    background:rgba(255,255,255,0.42);
    backdrop-filter:blur(28px) saturate(1.5);
    -webkit-backdrop-filter:blur(28px) saturate(1.5);
    border:1px solid rgba(255,255,255,0.85);
    border-radius:var(--radius-lg);
    box-shadow:0 1px 1px rgba(255,255,255,0.6) inset, 0 -1px 12px rgba(255,255,255,0.3) inset, 0 20px 40px -18px rgba(43,36,28,0.16);
  }

  .desk{display:grid; grid-template-columns:1.7fr 1fr; gap:20px; align-items:start;}

  .panel{padding:20px 20px 16px;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .panel-title{font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px;}
  .panel-title .dot{width:7px;height:7px;border-radius:50%;}
  .panel-count{font-size:11px; color:var(--ink-faint); font-weight:600;}
  .panel-add{border:none; background:transparent; color:var(--accent-deep); cursor:pointer; font-size:12.5px; font-weight:600; font-family:'Instrument Sans',sans-serif;}
  .panel-add:hover{text-decoration:underline;}

  .col-today .dot{background:var(--accent);}
  .col-thisweek .dot{background:var(--ink-faint);}
  .col-pending .dot{background:var(--ink-faint);}
  .col-someday .dot{background:var(--ink-faint);}
  .col-done .dot{background:var(--ink-faint);}

  .rail{display:flex; flex-direction:column; gap:16px;}
  .rail-panel .task-card{padding:11px 12px;}

  .supporting{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .supporting .panel{padding:14px 16px 10px;}
  .supporting .task-card{padding:9px 11px; font-size:12.5px;}

  .task-list{display:flex; flex-direction:column; gap:9px; min-height:24px;}
  .task-card{
    background:rgba(255,255,255,0.5);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,0.7);
    border-radius:var(--radius-sm);
    padding:13px 14px;
    cursor:grab;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .task-card:hover{border-color:rgba(217,134,63,0.35); box-shadow:0 6px 18px -10px rgba(43,36,28,0.25);}
  .task-card.dragging{opacity:0.4;}
  .task-card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .task-name{font-size:13.5px; font-weight:600; line-height:1.35; color:var(--ink);}
  .task-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .meta-chip{font-size:10px; text-transform:uppercase; letter-spacing:0.05em; font-weight:600; padding:2px 7px; border-radius:20px; color:var(--ink-soft); background:rgba(43,36,28,0.05);}
  .meta-chip.due{color:var(--accent-deep); background:var(--accent-wash);}
  .meta-chip.due.overdue{color:#fff; background:var(--danger);}
  .meta-chip.ticket{font-family:monospace; letter-spacing:0;}
  .task-next{font-size:12px; color:var(--ink-soft); margin-top:7px; line-height:1.4;}
  .status-pill{
    border:none; cursor:pointer; font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em;
    font-weight:700; padding:3px 6px; border-radius:6px; color:var(--ink-faint);
    background:rgba(43,36,28,0.05); font-family:'Instrument Sans',sans-serif; flex-shrink:0;
  }
  .status-pill:hover{background:rgba(217,134,63,0.18); color:var(--accent-deep);}
  .card-actions{display:flex; align-items:center; gap:6px;}
  .icon-btn{border:none;background:transparent;cursor:pointer;color:var(--ink-faint);font-size:13px;padding:2px;}
  .icon-btn:hover{color:var(--danger);}

  .empty-hint{font-size:12px; color:var(--ink-faint); padding:10px 4px; text-align:center; border:1px dashed var(--line); border-radius:10px;}
  .drop-target{outline:2px dashed var(--accent); outline-offset:4px; border-radius:12px;}

  .waiting-item{font-size:12px; padding:7px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:8px;}
  .waiting-item:last-child{border-bottom:none;}
  .waiting-who{font-weight:600; color:var(--ink);}
  .waiting-what{color:var(--ink-soft);}

  .decision-row{padding:12px 14px; border-radius:var(--radius-sm); background:var(--glass-fill-soft); border:1px solid rgba(43,36,28,0.06); margin-bottom:8px; cursor:pointer;}
  .decision-top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .decision-title{font-size:13px; font-weight:600;}
  .decision-type{font-size:10px; text-transform:uppercase; letter-spacing:0.05em; font-weight:700; color:var(--accent-deep); background:var(--accent-wash); padding:2px 8px; border-radius:20px;}
  .decision-date{font-size:11px; color:var(--ink-faint);}
  .decision-body{font-size:12px; color:var(--ink-soft); margin-top:6px; line-height:1.5; display:none;}
  .decision-row.open .decision-body{display:block;}

  .modal-overlay{position:fixed; inset:0; background:rgba(43,36,28,0.35); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:50;}
  .modal-overlay.show{display:flex;}
  .modal{width:460px; max-width:92vw; max-height:86vh; overflow-y:auto; background:#FDFBF8; border-radius:var(--radius-lg); padding:24px; box-shadow:0 30px 60px -20px rgba(43,36,28,0.4);}
  .modal h3{font-size:17px; margin-bottom:16px;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; font-weight:600; color:var(--ink-faint); margin-bottom:5px;}
  .field input, .field textarea, .field select{width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--line); font-family:'Instrument Sans',sans-serif; font-size:13px; background:#fff; color:var(--ink);}
  .field textarea{resize:vertical; min-height:52px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
  .btn{padding:9px 16px; border-radius:10px; border:none; cursor:pointer; font-weight:600; font-size:13px; font-family:'Outfit',sans-serif;}
  .btn-primary{background:linear-gradient(135deg, var(--accent), var(--accent-deep)); color:#fff;}
  .btn-ghost{background:transparent; color:var(--ink-soft);}
  .btn-danger{background:var(--danger); color:#fff;}

  @media (max-width:980px){
    .app{grid-template-columns:1fr;}
    .sidebar{flex-direction:row; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line);}
    .desk{grid-template-columns:1fr;}
    .mission{grid-template-columns:1fr 1fr;}
    .supporting{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-text">Execution Tower</div>
        <div class="brand-sub">Daily Ops</div>
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-label">Needs Attention</div>
      <div class="nav-item active" data-scroll="today">Today <span class="nav-count" id="count-today">0</span></div>
      <div class="nav-item" data-scroll="pending">Waiting On <span class="nav-count" id="count-waiting">0</span></div>
    </div>

    <div class="nav-group">
      <div class="nav-label">Workspace</div>
      <div class="nav-item" data-scroll="thisweek">This Week <span class="nav-count" id="count-thisweek">0</span></div>
      <div class="nav-item" data-scroll="pending">Pending <span class="nav-count" id="count-pending">0</span></div>
      <div class="nav-item" data-scroll="someday">Someday <span class="nav-count" id="count-someday">0</span></div>
      <div class="nav-item" data-scroll="done">Done <span class="nav-count" id="count-done">0</span></div>
      <div class="nav-item" data-scroll="decisions">Decision Log</div>
    </div>

    <div class="sidebar-footer">
      <button class="add-task-btn" onclick="openTaskModal()">+ New Task</button>
      <button class="clean-session-btn" onclick="cleanSession()">Clean Session</button>
    </div>
  </div>

  <div class="main">

    <div class="mission">
      <div class="mission-tile">
        <div class="mission-tile-label">Mission</div>
        <div class="mission-tile-value" contenteditable data-placeholder="What must be true today..." id="m-mission"></div>
      </div>
      <div class="mission-tile">
        <div class="mission-tile-label">Top Risk</div>
        <div class="mission-tile-value" contenteditable data-placeholder="Biggest exposure..." id="m-risk"></div>
      </div>
      <div class="mission-tile">
        <div class="mission-tile-label">Leadership Needs</div>
        <div class="mission-tile-value" contenteditable data-placeholder="Who + what's needed..." id="m-leadership"></div>
      </div>
      <div class="mission-tile">
        <div class="mission-tile-label">EOD Target</div>
        <div class="mission-tile-value" contenteditable data-placeholder="Must be true by close..." id="m-eod"></div>
      </div>
    </div>

    <div class="desk">
      <div class="glass panel col-today" id="today" data-status="today">
        <div class="panel-head">
          <div class="panel-title"><span class="dot"></span>Today <span class="panel-count" id="pc-today">(0)</span></div>
          <button class="panel-add" onclick="openTaskModal('today')">+ add</button>
        </div>
        <div class="task-list" id="list-today"></div>
      </div>

      <div class="rail">
        <div class="glass panel rail-panel col-thisweek" id="thisweek" data-status="thisweek">
          <div class="panel-head">
            <div class="panel-title"><span class="dot"></span>This Week <span class="panel-count" id="pc-thisweek">(0)</span></div>
            <button class="panel-add" onclick="openTaskModal('thisweek')">+ add</button>
          </div>
          <div class="task-list" id="list-thisweek"></div>
        </div>

        <div class="glass panel rail-panel col-pending" id="pending" data-status="pending">
          <div class="panel-head">
            <div class="panel-title"><span class="dot"></span>Pending <span class="panel-count" id="pc-pending">(0)</span></div>
            <button class="panel-add" onclick="openTaskModal('pending')">+ add</button>
          </div>
          <div class="task-list" id="list-pending"></div>
        </div>
      </div>
    </div>

    <div class="supporting">
      <div class="glass panel">
        <div class="panel-head">
          <div class="panel-title"><span class="dot" style="background:var(--ink-faint)"></span>Waiting On</div>
        </div>
        <div id="waiting-on-list"></div>
      </div>

      <div class="glass panel col-someday" id="someday" data-status="someday">
        <div class="panel-head">
          <div class="panel-title"><span class="dot"></span>Someday <span class="panel-count" id="pc-someday">(0)</span></div>
          <button class="panel-add" onclick="openTaskModal('someday')">+ add</button>
        </div>
        <div class="task-list" id="list-someday"></div>
      </div>
    </div>

    <div class="supporting">
      <div class="glass panel col-done" id="done" data-status="done">
        <div class="panel-head">
          <div class="panel-title"><span class="dot"></span>Done Today <span class="panel-count" id="pc-done">(0)</span></div>
        </div>
        <div class="task-list" id="list-done"></div>
      </div>

      <div class="glass panel" id="decisions">
        <div class="panel-head">
          <div class="panel-title"><span class="dot" style="background:var(--ink-faint)"></span>Decision Log</div>
          <button class="panel-add" onclick="openDecisionModal()">+ log</button>
        </div>
        <div id="decision-list"></div>
      </div>
    </div>

  </div>
</div>

<div class="modal-overlay" id="task-modal-overlay">
  <div class="modal">
    <h3 id="task-modal-title">New Task</h3>
    <input type="hidden" id="t-id">
    <div class="field">
      <label>Task Name</label>
      <input type="text" id="t-name" placeholder="What needs to happen">
    </div>
    <div class="field-row">
      <div class="field">
        <label>RITM / INC / Link</label>
        <input type="text" id="t-ticket" placeholder="RITMxxxxxxx">
      </div>
      <div class="field">
        <label>Due</label>
        <input type="date" id="t-due">
      </div>
    </div>
    <div class="field">
      <label>Next Action</label>
      <input type="text" id="t-next" placeholder="Immediate next step">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Waiting On (Who)</label>
        <input type="text" id="t-waiting-who" placeholder="Name">
      </div>
      <div class="field">
        <label>Waiting On (What)</label>
        <input type="text" id="t-waiting-what" placeholder="What you need from them">
      </div>
    </div>
    <div class="field">
      <label>Status</label>
      <select id="t-status">
        <option value="today">Today</option>
        <option value="thisweek">This Week</option>
        <option value="pending">Pending</option>
        <option value="someday">Someday</option>
        <option value="done">Done</option>
      </select>
    </div>
    <div class="field">
      <label>Context / Notes</label>
      <textarea id="t-context" placeholder="Optional"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="t-delete-btn" style="display:none;" onclick="deleteTaskFromModal()">Delete</button>
      <button class="btn btn-ghost" onclick="closeTaskModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTaskFromModal()">Save</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="decision-modal-overlay">
  <div class="modal">
    <h3>Log a Decision</h3>
    <div class="field">
      <label>Decision</label>
      <input type="text" id="d-title" placeholder="What was decided">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Type</label>
        <select id="d-type">
          <option>Strategy</option><option>Scope</option><option>Technical</option>
          <option>Vendor</option><option>Procurement</option><option>Process</option>
          <option>Leadership</option><option>Scheduling</option><option>Communications</option>
          <option>Risk Acceptance</option>
        </select>
      </div>
      <div class="field">
        <label>Owner</label>
        <input type="text" id="d-owner" placeholder="Who owns this">
      </div>
    </div>
    <div class="field">
      <label>Reasoning</label>
      <textarea id="d-reasoning" placeholder="Why this path"></textarea>
    </div>
    <div class="field">
      <label>Alternatives Considered</label>
      <textarea id="d-alternatives" placeholder="Optional"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeDecisionModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveDecision()">Log Decision</button>
    </div>
  </div>
</div>

<script>
let state = {
  mission: { mission:'', risk:'', leadership:'', eod:'' },
  tasks: [],
  decisions: []
};

const STORAGE_KEY = 'execution-tower-state';

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      state = JSON.parse(res.value);
    }
  }catch(e){ /* no saved state yet */ }
  render();
}

async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
  }catch(e){ console.error('save failed', e); }
}

function uid(){ return 't' + Math.random().toString(36).slice(2,10); }

['mission','risk','leadership','eod'].forEach(key=>{
  const el = document.getElementById('m-' + key);
  el.addEventListener('blur', ()=>{
    state.mission[key] = el.textContent.trim();
    saveState();
  });
});

function fmtDue(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((d - today)/86400000);
  const label = d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  return { label, overdue: diff < 0 };
}

function taskCard(t){
  const div = document.createElement('div');
  div.className = 'task-card';
  div.draggable = true;
  div.dataset.id = t.id;

  div.addEventListener('dragstart', e=>{
    div.classList.add('dragging');
    e.dataTransfer.setData('text/plain', t.id);
  });
  div.addEventListener('dragend', ()=> div.classList.remove('dragging'));
  div.addEventListener('click', (e)=>{
    if(e.target.classList.contains('status-pill') || e.target.classList.contains('icon-btn')) return;
    openTaskModal(null, t.id);
  });

  const due = fmtDue(t.due);
  const chips = [];
  if(t.ticket) chips.push(`<span class="meta-chip ticket">${escapeHtml(t.ticket)}</span>`);
  if(due) chips.push(`<span class="meta-chip due ${due.overdue?'overdue':''}">${due.overdue?'overdue · ':''}${due.label}</span>`);

  const statuses = ['today','thisweek','pending','someday','done'];
  const nextStatus = statuses[(statuses.indexOf(t.status)+1) % statuses.length];

  div.innerHTML = `
    <div class="task-card-top">
      <div class="task-name">${escapeHtml(t.name)}</div>
      <div class="card-actions">
        <button class="status-pill" title="Move to next section" onclick="event.stopPropagation(); moveTask('${t.id}','${nextStatus}')">${labelFor(nextStatus)}</button>
        <button class="icon-btn" title="Delete" onclick="event.stopPropagation(); removeTask('${t.id}')">✕</button>
      </div>
    </div>
    ${chips.length ? `<div class="task-meta">${chips.join('')}</div>` : ''}
    ${t.next ? `<div class="task-next">→ ${escapeHtml(t.next)}</div>` : ''}
  `;
  return div;
}

function labelFor(status){
  return {today:'Today',thisweek:'This Wk',pending:'Pending',someday:'Someday',done:'Done'}[status];
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function render(){
  const cols = ['today','thisweek','pending','someday','done'];
  cols.forEach(status=>{
    const list = document.getElementById('list-' + status);
    list.innerHTML = '';
    const items = state.tasks.filter(t=>t.status===status);
    if(items.length === 0){
      list.innerHTML = '<div class="empty-hint">Nothing here</div>';
    } else {
      items.forEach(t=> list.appendChild(taskCard(t)));
    }
    document.getElementById('pc-' + status).textContent = `(${items.length})`;
    document.getElementById('count-' + status).textContent = items.length;
  });

  const waitingItems = state.tasks.filter(t=> t.status==='pending' && (t.waitingWho || t.waitingWhat));
  const waitingEl = document.getElementById('waiting-on-list');
  document.getElementById('count-waiting').textContent = waitingItems.length;
  if(waitingItems.length === 0){
    waitingEl.innerHTML = '<div class="empty-hint">Nothing waiting on anyone</div>';
  } else {
    waitingEl.innerHTML = waitingItems.map(t=>`
      <div class="waiting-item">
        <span class="waiting-who">${escapeHtml(t.waitingWho || '—')}</span>
        <span class="waiting-what">${escapeHtml(t.waitingWhat || t.name)}</span>
      </div>
    `).join('');
  }

  const decEl = document.getElementById('decision-list');
  if(state.decisions.length === 0){
    decEl.innerHTML = '<div class="empty-hint">No decisions logged</div>';
  } else {
    decEl.innerHTML = state.decisions.slice().reverse().map(d=>`
      <div class="decision-row" onclick="this.classList.toggle('open')">
        <div class="decision-top">
          <div class="decision-title">${escapeHtml(d.title)}</div>
          <div class="decision-type">${escapeHtml(d.type)}</div>
        </div>
        <div class="decision-date">${escapeHtml(d.date)} · ${escapeHtml(d.owner||'unassigned')}</div>
        <div class="decision-body">
          ${d.reasoning ? `<strong>Why:</strong> ${escapeHtml(d.reasoning)}<br>` : ''}
          ${d.alternatives ? `<strong>Alternatives:</strong> ${escapeHtml(d.alternatives)}` : ''}
        </div>
      </div>
    `).join('');
  }

  document.getElementById('m-mission').textContent = state.mission.mission || '';
  document.getElementById('m-risk').textContent = state.mission.risk || '';
  document.getElementById('m-leadership').textContent = state.mission.leadership || '';
  document.getElementById('m-eod').textContent = state.mission.eod || '';
}

document.querySelectorAll('[data-status]').forEach(col=>{
  col.addEventListener('dragover', e=>{
    e.preventDefault();
    col.classList.add('drop-target');
  });
  col.addEventListener('dragleave', ()=> col.classList.remove('drop-target'));
  col.addEventListener('drop', e=>{
    e.preventDefault();
    col.classList.remove('drop-target');
    const id = e.dataTransfer.getData('text/plain');
    moveTask(id, col.dataset.status);
  });
});

function moveTask(id, status){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  t.status = status;
  saveState();
  render();
}

function removeTask(id){
  state.tasks = state.tasks.filter(t=>t.id!==id);
  saveState();
  render();
}

function openTaskModal(defaultStatus, editId){
  document.getElementById('task-modal-overlay').classList.add('show');
  const delBtn = document.getElementById('t-delete-btn');
  if(editId){
    const t = state.tasks.find(t=>t.id===editId);
    document.getElementById('task-modal-title').textContent = 'Edit Task';
    document.getElementById('t-id').value = t.id;
    document.getElementById('t-name').value = t.name || '';
    document.getElementById('t-ticket').value = t.ticket || '';
    document.getElementById('t-due').value = t.due || '';
    document.getElementById('t-next').value = t.next || '';
    document.getElementById('t-waiting-who').value = t.waitingWho || '';
    document.getElementById('t-waiting-what').value = t.waitingWhat || '';
    document.getElementById('t-status').value = t.status;
    document.getElementById('t-context').value = t.context || '';
    delBtn.style.display = 'inline-block';
  } else {
    document.getElementById('task-modal-title').textContent = 'New Task';
    document.getElementById('t-id').value = '';
    ['t-name','t-ticket','t-due','t-next','t-waiting-who','t-waiting-what','t-context'].forEach(id=> document.getElementById(id).value='');
    document.getElementById('t-status').value = defaultStatus || 'today';
    delBtn.style.display = 'none';
  }
  document.getElementById('t-name').focus();
}

function closeTaskModal(){
  document.getElementById('task-modal-overlay').classList.remove('show');
}

function saveTaskFromModal(){
  const name = document.getElementById('t-name').value.trim();
  if(!name){ document.getElementById('t-name').focus(); return; }
  const id = document.getElementById('t-id').value;
  const data = {
    name,
    ticket: document.getElementById('t-ticket').value.trim(),
    due: document.getElementById('t-due').value,
    next: document.getElementById('t-next').value.trim(),
    waitingWho: document.getElementById('t-waiting-who').value.trim(),
    waitingWhat: document.getElementById('t-waiting-what').value.trim(),
    status: document.getElementById('t-status').value,
    context: document.getElementById('t-context').value.trim(),
  };
  if(id){
    const t = state.tasks.find(t=>t.id===id);
    Object.assign(t, data);
  } else {
    state.tasks.push({ id: uid(), ...data });
  }
  saveState();
  render();
  closeTaskModal();
}

function deleteTaskFromModal(){
  const id = document.getElementById('t-id').value;
  if(id) removeTask(id);
  closeTaskModal();
}

function openDecisionModal(){
  document.getElementById('decision-modal-overlay').classList.add('show');
  ['d-title','d-owner','d-reasoning','d-alternatives'].forEach(id=> document.getElementById(id).value='');
  document.getElementById('d-title').focus();
}
function closeDecisionModal(){
  document.getElementById('decision-modal-overlay').classList.remove('show');
}
function saveDecision(){
  const title = document.getElementById('d-title').value.trim();
  if(!title){ document.getElementById('d-title').focus(); return; }
  state.decisions.push({
    title,
    type: document.getElementById('d-type').value,
    owner: document.getElementById('d-owner').value.trim(),
    reasoning: document.getElementById('d-reasoning').value.trim(),
    alternatives: document.getElementById('d-alternatives').value.trim(),
    date: new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}),
    status:'Active'
  });
  saveState();
  render();
  closeDecisionModal();
}

function cleanSession(){
  const wiping = state.tasks.filter(t=> ['today','thisweek','pending'].includes(t.status));
  const ok = confirm(`Start a clean session?\n\nThis clears ${wiping.length} task${wiping.length===1?'':'s'} from Today, This Week, and Pending, plus Mission, Top Risk, Leadership Needs, and EOD Target.\n\nSomeday and Done are left alone.`);
  if(!ok) return;
  state.tasks = state.tasks.filter(t=> !['today','thisweek','pending'].includes(t.status));
  state.mission = { mission:'', risk:'', leadership:'', eod:'' };
  saveState();
  render();
}

document.querySelectorAll('.nav-item[data-scroll]').forEach(item=>{
  item.addEventListener('click', ()=>{
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    item.classList.add('active');
    const target = document.getElementById(item.dataset.scroll);
    if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
  });
});

document.getElementById('task-modal-overlay').addEventListener('click', e=>{
  if(e.target.id==='task-modal-overlay') closeTaskModal();
});
document.getElementById('decision-modal-overlay').addEventListener('click', e=>{
  if(e.target.id==='decision-modal-overlay') closeDecisionModal();
});

loadState();
</script>

</body>
</html>
